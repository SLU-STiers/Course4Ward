# Local dev stack. Ollama runs on the host (it needs the GPU and the pulled model);
# override any ${VAR} below in a root .env file.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cims
      POSTGRES_PASSWORD: cims
      POSTGRES_DB: cims
    ports:
      - "127.0.0.1:5433:5432" # Host-only; 5433 avoids clashing with local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cims -d cims"]
      interval: 5s
      retries: 10

  ai_service:
    build: ./ai_service
    environment:
      OLLAMA_CHAT_URL: ${OLLAMA_CHAT_URL:-http://host.docker.internal:11434/api/chat}
      MODEL: ${MODEL:-qwen3.5:4b}
      FINE_TUNED_MODEL: ${FINE_TUNED_MODEL:-finetuned-qwen}
      EMBED_MODEL_PATH: /models/embedding
    volumes:
      - ${EMBED_MODEL_DIR:-C:/my_models/qwen3-embedding-0.6b}:/models/embedding:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      ai_service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cims:cims@db:5432/cims
      AI_SERVICE_URL: http://ai_service:8000
      BATCH_TEST_SCRIPT: /app/fine_tuning_data/batch_test.py
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      SUMMARY_BATCH_TIME: ${SUMMARY_BATCH_TIME:-23:59}
      TZ: ${TZ:-Asia/Manila}
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "0.0.0.0:5173:80"

volumes:
  pgdata:
